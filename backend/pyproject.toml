[project]
name = "accessreaper-v2"
version = "2.0.0"
description = "AccessReaper v2 - Rule-based IAM Audit System"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Allow FastAPI Depends() in function parameters
    "E501",  # Allow longer lines for long strings / URLs / regex
    "B904",  # Allow raise without from
    "E402",  # Allow sys.path mutations before imports in alembic env
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]
