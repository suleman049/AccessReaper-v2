name: AccessReaper CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov ruff httpx

      - name: Run Code Quality & Lint Checks
        run: |
          ruff check backend/app

      - name: Execute Automated Unit & Integration Tests
        run: |
          pytest backend/tests/test_scoring.py backend/tests/test_audit_log_immutability.py -v --junitxml=test-results.xml

      - name: Publish Test Results Evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: test-results.xml
